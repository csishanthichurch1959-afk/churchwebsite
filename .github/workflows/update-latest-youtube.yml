name: Update latest YouTube video

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - latest-video.json

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-latest-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest CSI Shanthi Church YouTube upload
        shell: python
        run: |
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          HANDLE = "csishanthichurch586"
          CHANNEL_URL = f"https://www.youtube.com/@{HANDLE}/videos"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  return response.read()

          page = fetch(
              CHANNEL_URL
          ).decode(
              "utf-8",
              "ignore"
          )

          patterns = [
              r'"channelId":"(UC[A-Za-z0-9_-]+)"',
              r'"externalId":"(UC[A-Za-z0-9_-]+)"',
              r'itemprop="channelId"\s+content="(UC[A-Za-z0-9_-]+)"'
          ]

          channel_id = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  page
              )

              if match:
                  channel_id = match.group(1)
                  break

          if not channel_id:
              raise RuntimeError(
                  "Could not resolve YouTube channel ID."
              )

          feed_url = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={channel_id}"
          )

          feed = fetch(feed_url)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
              "media": "http://search.yahoo.com/mrss/"
          }

          root = ET.fromstring(feed)

          entry = root.find(
              "atom:entry",
              ns
          )

          if entry is None:
              raise RuntimeError(
                  "YouTube feed contained no videos."
              )

          video_id = entry.findtext(
              "yt:videoId",
              default="",
              namespaces=ns
          ).strip()

          title = entry.findtext(
              default="CSI Shanthi Church on YouTube",
              namespaces=ns
          ).strip()

          published = entry.findtext(
              "atom:published",
              default="",
              namespaces=ns
          ).strip()

          payload = {
              "channelId": channel_id,
              "videoId": video_id,
              "title": title,
              "url": (
                  "https://www.youtube.com/watch?v="
                  + video_id
              ),
              "thumbnail": (
                  "https://i.ytimg.com/vi/"
                  + video_id
                  + "/maxresdefault.jpg"
              ),
              "published": published,
              "updatedBy": "github-actions"
          }

          Path(
              "latest-video.json"
          ).write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2
              )
          )

      - name: Commit update if latest video changed
        run: |
          if git diff --quiet -- latest-video.json; then
            echo "Latest video is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest-video.json

          git commit \
            -m "Auto-update latest YouTube video"

          git push
